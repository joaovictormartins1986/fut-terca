<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fut Terça</title>
<meta name="theme-color" content="#0b1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fut Terça">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1310;--s1:#121d18;--s2:#1a2822;--s3:#24362e;--line:#2b3f36;
  --tx:#e9f2ed;--mu:#8fa69b;--ac:#3ddc97;--ac2:#1f8f5f;--warn:#f5b041;--bad:#ef5350;
  --p1:#3ddc97;--p2:#7bd3f7;--p3:#c7b8ff;--p4:#f5b041;--p5:#ef8a6a;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:84px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.num,.cond{font-family:"Barlow Condensed",Inter,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(11,19,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-family:"Barlow Condensed";font-weight:800;font-size:24px;letter-spacing:.5px;text-transform:uppercase}
header h1 b{color:var(--ac)}
header .date{margin-left:auto;display:flex;align-items:center;gap:6px}
header .date input{width:auto;padding:6px 8px;font-size:14px}
.sync{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block}
.sync.ok i{background:var(--ac)}.sync.loc i{background:var(--warn)}.sync.err i{background:var(--bad)}
main{max-width:980px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--s1);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:150px;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:11px;font-weight:600}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{font-family:"Barlow Condensed";font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{margin-left:auto}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--s3);font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn.pri{background:var(--ac);color:#06281a;border-color:var(--ac)}
.btn.bad{background:transparent;color:var(--bad);border-color:#5a2a2a}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.blk{width:100%}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--s2);border-radius:10px;padding:10px 12px}
.stat .l{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-family:"Barlow Condensed";font-size:26px;font-weight:700;line-height:1.1}
.pos{color:var(--ac)}.neg{color:var(--bad)}
.potbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.potbar span{font-size:12.5px;padding:4px 9px;border-radius:20px;background:var(--s2);border:1px solid var(--line)}
.potbar span.w{border-color:var(--warn);color:var(--warn)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--s2);min-height:46px}
.prow.off{background:transparent;border:1px dashed var(--line)}
.prow.off .nm{opacity:.6}
.prow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-weight:800}
.prow:not(.off) .chk{background:var(--ac);border-color:var(--ac);color:#06281a}
.pots{display:flex;gap:3px;flex:none}
.pot{width:27px;height:30px;border-radius:7px;background:var(--s3);color:var(--mu);font-family:"Barlow Condensed";font-weight:700;font-size:16px}
.pot.sel{color:#08140f}
.pot.sel.p1{background:var(--p1)}.pot.sel.p2{background:var(--p2)}.pot.sel.p3{background:var(--p3)}.pot.sel.p4{background:var(--p4)}.pot.sel.p5{background:var(--p5)}
.pay{flex:none;min-width:58px;padding:7px 8px;border-radius:8px;font-size:12.5px;font-weight:700;border:1px solid var(--warn);color:var(--warn)}
.pay.ok{background:var(--ac2);border-color:var(--ac2);color:#dfffee}
.pay.ok{width:120px}
.pays{display:flex;gap:4px;flex:none}
.fech{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14.5px;align-items:center}
.fech .v{font-family:"Barlow Condensed";font-size:21px;font-weight:700;text-align:right}
.fech .big{font-size:30px;color:var(--ac)}
.fech hr{grid-column:1/-1;border:0;border-top:1px solid var(--line)}
.pb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-family:"Barlow Condensed";font-weight:700;font-size:13px;color:#08140f;flex:none}
.pb.p1{background:var(--p1)}.pb.p2{background:var(--p2)}.pb.p3{background:var(--p3)}.pb.p4{background:var(--p4)}.pb.p5{background:var(--p5)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.team{border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--line)}
.team .th{padding:8px 10px;display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed";font-weight:800;font-size:19px;text-transform:uppercase}
.team .th small{margin-left:auto;font-family:Inter;font-size:11.5px;font-weight:600;opacity:.85;text-transform:none}
.team ul{list-style:none;padding:6px}
.team li button{width:100%;display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;text-align:left}
.team li button.sel{background:var(--s3);outline:2px solid var(--ac)}
.sect{font-family:"Barlow Condensed";font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);grid-column:1/-1}
.sect .mu{font-family:Inter;font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#06281a}
.potsro{display:flex;gap:3px;margin-left:auto;flex:none}
.potsro span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:13px}
.potsro .po{color:var(--mu);opacity:.35;background:var(--s3)}
.potsect{display:flex;align-items:center;gap:8px}
.wtxt{color:var(--warn)!important}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--mu);font-weight:700;padding:2px 0}
.cal .wd.t{color:var(--ac)}
.cal button{position:relative;padding:8px 0;border-radius:8px;font-size:14px;color:var(--mu)}
.cal button.ter{color:var(--tx);font-weight:700;background:var(--s2);border:1px solid var(--ac2)}
.cal button.sel{background:var(--ac);color:#06281a;border-color:var(--ac)}
.cal button.hoje{text-decoration:underline}
.cal button .dt{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cal button.sel .dt{background:#06281a}
.cal button .dt.pend{background:var(--warn)}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh b{flex:1;text-align:center;font-family:"Barlow Condensed";font-size:18px;text-transform:capitalize}
.prow[hidden],.sect[hidden],.plist[hidden]{display:none!important}
.filtro{position:sticky;top:58px;z-index:5;background:var(--s1);padding:4px 0 8px}
.filtro input{font-size:16px}
.mtag{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:#2b3c6b;color:#b9cbff;font-size:11px;font-weight:800;vertical-align:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:20px;background:var(--s3);font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip.sel{outline:2px solid var(--ac)}
/* jogo */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.side{border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.side .tn{font-family:"Barlow Condensed";font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.5px}
.side .gl{font-family:"Barlow Condensed";font-weight:800;font-size:84px;line-height:.9}
.side .gb{display:flex;gap:8px}
.side .gb button{width:52px;height:44px;border-radius:12px;background:rgba(0,0,0,.25);font-size:24px;font-weight:800}
.side .gb button.plus{width:72px;background:rgba(0,0,0,.4)}
.side .roster{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.slot{width:100%;display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;background:rgba(0,0,0,.14);text-align:left;font-weight:600;font-size:14px;min-height:38px;color:inherit}
.slot .pb{box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.slot.vaga{background:transparent;border:2px dashed currentColor;opacity:.85;font-weight:700}
.slot.sub{background:rgba(255,255,255,.28)}
.slot small{font-weight:500;opacity:.75;font-size:11.5px;display:block}
.slot.aus{opacity:.55;text-decoration:line-through}
.qlist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.qlist .slot{background:var(--s3);color:var(--tx)}
.qlist .slot.aus{background:transparent;border:1px dashed var(--line)}
.slotw{display:flex;gap:4px;align-items:stretch;width:100%}
.slotw .slot{flex:1;min-width:0}
.sx{flex:none;width:34px;border-radius:9px;background:rgba(0,0,0,.22);color:inherit;font-weight:800;font-size:15px;display:grid;place-items:center;border:0;cursor:pointer}
.cand{display:flex;flex-direction:column;gap:6px}
.cand button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--s2);text-align:left;font-weight:600}
.evb{font-size:12px;margin-left:2px}
.abox{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border:1.5px solid currentColor;border-radius:3px;font-family:Inter,sans-serif;font-weight:800;font-size:.8em;line-height:1;vertical-align:-.12em;margin-right:2px}
.evlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hist div{flex-wrap:wrap}
.cand button small{margin-left:auto;color:var(--mu);font-weight:500}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:150px}
.clock{font-family:"Barlow Condensed";font-weight:800;font-size:76px;line-height:1;letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--warn)}.clock.end{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.ctrl{display:flex;gap:8px}
.ctrl .btn{padding:12px 16px;font-size:16px}
.result{display:contents}
.resdone{grid-column:1/-1;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resdone .rt{font-family:"Barlow Condensed";font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.5px}
.resdone .rt .num{margin-left:8px;opacity:.75}
.resdone .btn{background:rgba(0,0,0,.25);border:0;color:inherit}
.resdone .btn.pri{background:#0b1310;color:var(--ac);padding:12px 16px}
.result .btn{width:100%}
.result .btn{padding:14px 8px;font-size:15px}
.result .btn.sug{outline:3px solid #fff;outline-offset:2px}
.queue{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{border-radius:12px;padding:10px 12px;background:var(--s2);border-left:8px solid}
.qcard .ql{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.qcard .qn{font-family:"Barlow Condensed";font-size:22px;font-weight:800;text-transform:uppercase}
.qcard .qp{font-size:12.5px;color:var(--mu)}
.hist{display:flex;flex-direction:column;gap:4px}
.hist div{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--s2);border-radius:8px;font-size:14px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.flash{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:50}
.flash.go{animation:fl 2.4s ease-out}
@keyframes fl{0%,20%,40%{opacity:.55}10%,30%{opacity:0}100%{opacity:0}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.debt{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.debt .top{display:flex;align-items:center;gap:8px;font-weight:600}
.debt .top .v{margin-left:auto;color:var(--warn);font-family:"Barlow Condensed";font-size:20px}
.debt .days{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mu)}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
.banner{background:#3a2c10;border:1px solid #6b5016;color:#ffd99a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
#modal{position:fixed;inset:0;z-index:60;display:none}
#modal.open{display:block}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);max-height:86vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mbox h3{font-family:"Barlow Condensed";font-size:22px;text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--mu)}
@media (min-width:760px){
  .side .gb button{width:64px;height:56px;font-size:28px}
  .side .gb button.plus{width:96px}
  .ctrl .btn{padding:14px 22px;font-size:18px}
  .result .btn{padding:18px 8px;font-size:17px}
  .slot{min-height:44px;font-size:15px}
  .clock{font-size:clamp(76px,11vw,120px)}
  .side .gl{font-size:clamp(84px,10vw,120px)}
  .side .tn{font-size:28px}
}
@media (min-width:1000px) and (orientation:landscape){
  main.wide{max-width:1500px}
  .jgrid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,1fr);gap:14px;align-items:start}
  .jside .queue{grid-template-columns:1fr}
  .jside .card h2{flex-wrap:wrap}
  .jside .qlist .slot{min-height:36px;padding:5px 8px}
  .jside .qcard .qn{font-size:20px}
  .clock{font-size:clamp(90px,9vw,150px)}
  .mid{min-width:200px}
}
@media (min-width:1000px) and (orientation:landscape) and (max-height:900px){
  .jmain .card{padding:12px}
  .jmain .card h2{margin-bottom:6px}
  .side{padding:10px;gap:4px}
  .side .gl{font-size:96px}
  .side .tn{font-size:26px}
  .side .roster .slot{min-height:38px;padding:5px 8px}
  .result .btn{padding:15px 8px}
  .rulehint{display:none}
}
@media (min-width:1100px){ .plist{display:grid;grid-template-columns:1fr 1fr} }
@media (max-width:620px){
  .board{grid-template-columns:1fr 1fr}
  .mid{grid-column:1/-1;order:-1;flex-direction:row;flex-wrap:wrap}
  .result .btn[data-r="e"]{grid-column:1/-1;order:1}
  .clock{font-size:84px;width:100%;text-align:center}
  .side .gl{font-size:72px}
  header h1{font-size:20px}
  .sync span{display:none}
  .prow{flex-wrap:wrap;row-gap:6px}
  .prow .nm{flex:1 1 calc(100% - 44px)}
  .prow .pots{margin-left:0}
  .prow .pay{min-width:52px;padding:7px 6px}
  .prow .pay.ok{width:108px}
  .prow .pays{margin-left:auto}
  .prow.inl{flex-wrap:nowrap}
  .prow.inl .nm{flex:1 1 auto}
}
/* celular deitado: tudo do jogo cabe numa tela */
@media (orientation:landscape) and (max-height:520px){
  header{padding:5px 12px} header h1{font-size:18px} header .date input{padding:3px 6px;font-size:13px}
  body{padding-bottom:44px}
  nav button{flex-direction:row;justify-content:center;gap:6px;padding:7px 4px;font-size:12px}
  nav button svg{width:18px;height:18px}
  main{padding:8px}
  .card{padding:10px;margin-bottom:10px}
  .jmain .card>h2{display:none}
  .side{padding:6px 8px;gap:3px;border-radius:12px}
  .side .tn{font-size:19px}
  .side .tn + .sm{display:none}
  .side .gl{font-size:54px}
  .side .gb button{width:44px;height:38px;font-size:22px}
  .side .gb button.plus{width:64px}
  .side .roster{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:2px}
  .side .roster .slot{width:auto;min-height:0;padding:3px 6px;font-size:12px;gap:4px}
  .side .roster .slot small{display:inline;margin-left:3px}
  .side .roster .slot .pb{width:15px;height:15px;font-size:10px}
  .side .roster .slotw{width:auto}
  .side .roster .sx{width:24px;font-size:12px;border-radius:7px}
  .mid{min-width:130px;gap:6px}
  .clock{font-size:66px}
  .ctrl .btn{padding:8px 12px;font-size:14px}
  .result .btn{padding:10px 6px;font-size:14px}
  .rulehint{display:none}
}
.mbox .plist{display:flex!important;flex-direction:column;gap:6px}
.mbox .prow .nm{flex:1;min-width:0}
/* quinta: cronômetro em destaque com botões ao lado, TIME 1 X TIME 2, sem botões de resultado */
.side .gb button.plus{width:52px}
.clockbox{background:var(--s2);border:2px solid var(--line);border-radius:20px;padding:12px 16px;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 28px;margin-bottom:12px}
.clockbox .clock{font-size:clamp(100px,16vw,180px);width:auto;line-height:.95}
.clockbox .ctrl{flex-direction:column;gap:10px}
.clockbox .ctrl .btn{white-space:nowrap;padding:18px 26px;font-size:22px;min-width:190px;border-radius:14px}
.clockbox .cmsg{flex-basis:100%;display:flex;justify-content:center}
.board.vsb{grid-template-columns:1fr auto 1fr;gap:10px}

<script>
/* ================= base ================= */
const $ = s => document.querySelector(s);
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const matchNm = (nome, q) => { q = norm(q); if (!q) return true; const n = norm(nome); return n.startsWith(q) || n.split(/[\s()]+/).some(w => w.startsWith(q)); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fdate = s => { const d = parseD(s); return `${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fmonth = s => { const [y,m] = s.split('-').map(Number); return `${MES[m-1]} de ${y}`; };
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function defaultDate(){
  const t = new Date(); const dw = t.getDay();
  if (dw === 2) return ymd(t);
  if (dw === 3 || dw === 4) { t.setDate(t.getDate() - (dw - 2)); return ymd(t); } // qua/qui: terça que passou
  t.setDate(t.getDate() + ((2 - dw + 7) % 7)); return ymd(t);                       // próxima terça
}

// coletes: lado esquerdo do painel = amarelo, lado direito = azul
const COLETE = [ {n:'Amarelo', c:'#facc15', t:'#1d1a05'}, {n:'Azul', c:'#3b82f6', t:'#ffffff'} ];
const TEAMC = '#2c4339';
const DEF = { valorHora:180, horas:2, valorJogador:25, valorMensal:100, minutos:8, gols:3 };

/* ================= estado ================= */

/* ================= persistência (Supabase) ================= */
const SUPA_URL = 'https://nxgkohbvzijspdznvsbh.supabase.co', SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54Z2tvaGJ2emlqc3Bkem52c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4Mzg0MDQsImV4cCI6MjExMDQxNDQwNH0.V_Ybp7Nk6nTtIT_cFZR76B_CXckWMG9RBEQfJXQ5oMA';
let sb = null, db = null, rtChan = null;
const pend = {}, chain = {};
const COLS = { players:'players', days:'days', ledger:'ledger', meses:'meses' };
function lsSave(){ try{ localStorage.setItem('futterca_cache', JSON.stringify(S)); }catch(e){} }
function lsLoad(){ try{ const d = JSON.parse(localStorage.getItem('futterca_cache')||'null'); if(d){ S.players=d.players||{}; S.days=d.days||{}; S.ledger=d.ledger||{}; S.meses=d.meses||{}; S.config={...DEF,...(d.config||{})}; } }catch(e){} }

function save(path, data){            // data === null → apaga
  lsSave();
  if (!db) return;
  if (pend[path]) clearTimeout(pend[path].t);
  pend[path] = { data: data === null ? null : clone(data), t: setTimeout(() => flush(path), 400) };
}
function flushAll(){ Object.keys(pend).forEach(p => { clearTimeout(pend[p].t); flush(p); }); }
function flush(path){
  const p = pend[path]; if (!p) return;
  chain[path] = (chain[path] || Promise.resolve()).then(async () => {
    const run = async () => {
      const r = p.data === null
        ? await sb.from('docs').delete().eq('path', path)
        : await sb.from('docs').upsert({ path, col: path.split('/')[0], data: p.data, updated_at: new Date().toISOString() });
      if (r.error) throw r.error;
    };
    try { await run(); setSync('ok','sincronizado'); }
    catch(e){ await sleep(800 + Math.random()*900); try{ await run(); setSync('ok','sincronizado'); }catch(e2){ writeFail(e2); } }
    finally { if (pend[path] === p) delete pend[path]; }
  });
}
function writeFail(e){
  setSync('err', 'erro ao salvar');
  console.error(e);
  toast(e && /row-level|permission|JWT/i.test(e.message||'') ? 'Sem permissão para salvar — faça login de novo' : 'Falha ao salvar — verifique a internet');
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
window.addEventListener('pagehide', flushAll);

function setSync(cls, txt){ const el = $('#sync'); el.className = 'sync ' + cls; el.querySelector('span').textContent = txt; }

function applyDoc(path, data){
  if (pend[path]) return;                 // edição local ainda não enviada vence
  const [col, id] = path.split('/');
  if (col === 'fut'){ if (id === 'config') S.config = {...DEF, ...(data || {})}; return; }
  if (!COLS[col]) return;
  if (data === null) delete S[col][id]; else S[col][id] = data;
}
async function loadAll(){
  const { data, error } = await sb.from('docs').select('path,data');
  if (error) throw error;
  S.players = {}; S.days = {}; S.ledger = {}; S.meses = {}; S.config = {...DEF};
  for (const r of data) applyDoc(r.path, r.data);
  lsSave();
}
function subscribe(){
  if (rtChan) sb.removeChannel(rtChan);
  rtChan = sb.channel('docs-rt').on('postgres_changes', { event:'*', schema:'public', table:'docs' }, ev => {
    if (ev.eventType === 'DELETE') applyDoc(ev.old.path, null); else applyDoc(ev.new.path, ev.new.data);
    lsSave(); softRender();
  }).subscribe(st => { if (st === 'SUBSCRIBED') setSync('ok','sincronizado'); else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setSync('err','reconectando…'); });
}
/* ---- login por código no e-mail ---- */

      <button class="btn pri blk" style="margin-top:10px" data-a="lgVerify">Entrar</button>
      <button class="btn blk" style="margin-top:8px" data-a="lgBack">Usar outro e-mail</button>`
    : `<input id="lgEmail" type="email" autocomplete="email" placeholder="seu@email.com">
      <button class="btn pri blk" style="margin-top:10px" data-a="lgSend">Enviar código</button>`}
  </div>`;
  setSync('loc','desconectado');
}
async function startData(){
  const ac = await sb.rpc('tem_acesso');
  if (ac.error || ac.data !== true){ await sb.auth.signOut(); ui.loginEmail = null; loginView(ac.error ? 'Não foi possível verificar o acesso. Tente de novo.' : 'Esse e-mail não tem acesso ao app. Peça ao administrador.'); return; }
  db = true; ui.mode = 'db'; setSync('loc','carregando…');
  lsLoad(); ui.loaded = Object.keys(S.players).length > 0; if (ui.loaded) render();
  try { await loadAll(); ui.loaded = true; setSync('ok','sincronizado'); render(); subscribe(); }
  catch(e){ console.error(e); ui.loaded = true; setSync('err', 'sem conexão'); render(); if (/JWT|auth/i.test(e.message||'')) { await sb.auth.signOut(); loginView('Sua sessão expirou. Entre de novo.'); } }
}
async function init(){
  if (!window.supabase){ ui.mode = 'local'; lsLoad(); ui.loaded = true; setSync('err','offline'); render(); return; }
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  if (location.hash && /access_token|error/.test(location.hash)) history.replaceState(null, '', location.pathname);
  let started = false;
  sb.auth.onAuthStateChange((ev, ses) => { if (ev === 'SIGNED_OUT') { started = false; loginView(); } else if (ev === 'SIGNED_IN' && ses && !started) { started = true; ui.loginEmail = null; startData(); } });
  if (!data.session){ loginView(); return; }
  if (!started){ started = true; startData(); }
}
window.addEventListener('online', () => { if (db) loadAll().then(() => { setSync('ok','sincronizado'); softRender(); }).catch(()=>{}); });

/* ================= helpers de dados ================= */
function getDay(date, create){
  if (!S.days[date] && create){
    S.days[date] = { data:date, presentes:[], potes:{}, pag:{}, times:null, fila:[0,1,2,3], jogos:[],
      valor:Number(S.config.valorJogador)||0, custo:(Number(S.config.valorHora)||0)*(Number(S.config.horas)||0) };
  }
  return S.days[date];
}
const saveDay = date => save('days/' + date, S.days[date]);
const savePlayer = id => save('players/' + id, S.players[id] || null);
const playedDays = () => Object.values(S.days).filter(d => (d.presentes && d.presentes.length) || (d.dev && Object.keys(d.dev).length)).sort((a,b) => a.data < b.data ? -1 : 1);
const paidOf = (d, id) => Number((d.pag || {})[id]) || 0;
// valor devido: por pessoa (mensalidade, goleiro, histórico) ou o valor do dia
const isGol = id => !!S.players[id]?.goleiro;
// Art. 28: goleiro não paga
// mensalidade: o mês define quem é mensalista e quais terças a mensalidade cobre
const mesDe = date => S.meses[(date || '').slice(0,7)];
const cobertoMensal = (date, id) => { const M = mesDe(date); return !!(M && (M.mens||[]).includes(id) && (M.datas||[]).includes(date)); };
const isMensal = (date, id) => { const M = mesDe(date); return M ? (M.mens||[]).includes(id) : !!S.players[id]?.mensalista; };
const dueOf = (d, id) => (d.dev && id in d.dev) ? (Number(d.dev[id]) || 0) : isGol(id) ? 0 : cobertoMensal(d.data, id) ? 0 : (d.presentes || []).includes(id) ? (Number(d.valor) || 0) : 0;
const partsOf = d => [...new Set([...(d.presentes || []), ...Object.keys(d.dev || {}), ...Object.keys(d.pag || {})])];
const isPaid = (d, id) => paidOf(d,id) >= dueOf(d,id) - 0.009;
const formaOf = (d, id) => ((d.forma || {})[id]) || 'pix';
function fechamento(d){
  let pix = 0, balcao = 0;
  for (const id of partsOf(d)){ const v = paidOf(d,id); if (formaOf(d,id) === 'balcao') balcao += v; else pix += v; }
  const custo = Number(d.custo) || 0;
  const pixDono = Math.max(0, custo - balcao), excesso = Math.max(0, balcao - custo);
  return { pix, balcao, custo, pixDono, excesso };
}
// pendências: só dias que já passaram (o dia de hoje ainda está sendo cobrado)
function balances(){
  const b = {}, hoje = ymd(new Date());
  for (const d of playedDays().filter(x => x.data < hoje)) for (const id of partsOf(d)){
    const x = b[id] ||= {net:0, days:[]};
    const diff = dueOf(d,id) - paidOf(d,id); x.net += diff;
    if (diff > 0.009) x.days.push({date:d.data, due:diff});
  }
  for (const [mid, M] of Object.entries(S.meses)){
    if (!(M.datas||[]).length || [...M.datas].sort()[0] >= hoje) continue;   // vira pendência depois da 1ª terça do mês
    for (const id of M.mens||[]){
      const x = b[id] ||= {net:0, days:[]};
      const diff = (Number(M.valor)||0) - (Number((M.pag||{})[id])||0); x.net += diff;
      if (diff > 0.009) x.days.push({date:mid, due:diff, mes:true});
    }
  }
  return b;
}
// pendências já descontando crédito de quem pagou a mais
function debts(){
  const m = {};
  for (const [id,x] of Object.entries(balances())) if (x.net > 0.009) m[id] = { total:x.net, days:x.days, credito: x.days.reduce((s,o)=>s+o.due,0) - x.net };
  return m;
}
function credits(){ return Object.entries(balances()).filter(([,x]) => x.net < -0.009).map(([id,x]) => [id, -x.net]); }
function faltando(){
  const ds = Object.keys(S.days).sort(); const ini = ds.length ? ds[0] : null; if (!ini) return [];
  const out = [], hoje = ymd(new Date()); const t = parseD(ini); while (t.getDay() !== 2) t.setDate(t.getDate() + 1);
  for (; ymd(t) < hoje; t.setDate(t.getDate() + 7)){ const k = ymd(t), d = S.days[k];
    if (!d || (!(d.presentes||[]).length && !d.semJogo && !Object.keys(d.dev||{}).length)) out.push(k); }
  return out;
}
function caixa(){
  let arrec = 0, quadra = 0, ent = 0, sai = 0;
  for (const d of playedDays()){ quadra += Number(d.custo)||0; for (const id of partsOf(d)) arrec += paidOf(d,id); }
  for (const M of Object.values(S.meses)) for (const v of Object.values(M.pag||{})) arrec += Number(v)||0;
  for (const l of Object.values(S.ledger)){ if (l.tipo === 'entrada') ent += Number(l.valor)||0; else sai += Number(l.valor)||0; }
  return { arrec, quadra, ent, sai, saldo: arrec - quadra + ent - sai };
}
function goalStats(days){
  const g = {}, a = {};
  for (const d of days) for (const j of (d.jogos||[])) for (const e of (j.ev||[])){
    if (e.g && e.g !== 'contra') g[e.g] = (g[e.g]||0) + 1;
    if (e.a) a[e.a] = (a[e.a]||0) + 1;
  }
  return { g, a };
}
function winsByPlayer(days){
  const w = {};
  for (const d of days) for (const j of (d.jogos||[])){
    if (j.r === 'e' || !d.times) continue;
    const t = j.r === 'a' ? j.a : j.b;
    (j.esc ? j.esc[j.r === 'a' ? 0 : 1] : d.times[t] || []).forEach(id => w[id] = (w[id]||0) + 1);
  }
  return w;
}

/* ================= áudio / cronômetro ================= */
let ac = null, wake = null;
function audio(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){} return ac; }
function tone(f, t0, d, vol = .5, type = 'square'){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, n+t0); g.gain.exponentialRampToValueAtTime(vol, n+t0+.01);
  g.gain.setValueAtTime(vol, n+t0+d-.04); g.gain.exponentialRampToValueAtTime(0.0001, n+t0+d);
  o.connect(g).connect(a.destination); o.start(n+t0); o.stop(n+t0+d+.03);
}
function whistle(){
  for (let i=0;i<3;i++){ tone(2300, i*.75, .55, .55, 'square'); tone(2750, i*.75, .55, .25, 'sawtooth'); }
  try { navigator.vibrate && navigator.vibrate([600,200,600,200,900]); } catch(e){}
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
// apito de início: um apito longo e alto
function startWhistle(){ tone(2300, 0, 1.1, .6, 'square'); tone(2750, 0, 1.1, .3, 'sawtooth'); try { navigator.vibrate && navigator.vibrate(700); } catch(e){} }
const shortBeep = () => { tone(1500, 0, .18, .4); tone(1500, .28, .18, .4); };
async function keepAwake(on){
  try { if (on && 'wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); }
        if (!on && wake){ await wake.release(); wake = null; } } catch(e){}
}
const LIVE0 = () => ({ date:null, run:false, start:0, acc:0, g:[0,0], ev:[], done:false, warned:false, why:'' });
let live = (() => { try { return {...LIVE0(), ...JSON.parse(localStorage.getItem('futterca_live')||'{}')}; } catch(e){ return LIVE0(); } })();
const saveLive = () => { try { localStorage.setItem('futterca_live', JSON.stringify(live)); } catch(e){} };
const dur = () => (Number(S.config.minutos)||8) * 60000;
const elapsed = () => live.acc + (live.run ? Date.now() - live.start : 0);
const remaining = () => Math.max(0, dur() - elapsed());
const fclock = ms => { const s = Math.ceil(ms/1000); return `${Math.floor(s/60)}:${pad(s%60)}`; };
function endGame(why){
  if (live.run){ live.acc = elapsed(); live.run = false; }
  live.done = true; live.why = why; saveLive(); whistle(); keepAwake(false);
  if (ui.tab === 'jogo') render();
}
function tick(){
  if (live.run){
    const r = remaining();
    if (!live.warned && r <= 60000 && dur() > 60000){ live.warned = true; saveLive(); shortBeep(); }
    if (r <= 0) endGame('tempo');
  }
  const c = document.getElementById('clock');
  if (c){ const r = live.done ? 0 : remaining(); c.textContent = fclock(r);
    c.className = 'clock' + (live.done ? ' end' : r <= 60000 ? ' warn' : ''); }
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ tick(); if (live.run) keepAwake(true); } });

const TABS = [['dia','Lista'],['sorteio','Sorteio'],['jogo','Jogo'],['caixa','Caixa'],['relatorios','Relatórios'],['cadastro','Cadastro']];
function renderNav(){ $('#nav').innerHTML = TABS.map(([k,l]) => `<button class="${ui.tab===k?'on':''}" data-a="tab" data-k="${k}">${ICONS[k]}${l}</button>`).join(''); }

let softPending = false;
function softRender(){
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $('#view').contains(ae)){
    if (!softPending){ softPending = true; ae.addEventListener('blur', () => { softPending = false; setTimeout(render, 50); }, {once:true}); }
    return;
  }
  render();
}
function render(){
  renderNav();
  $('#dateIn').value = ui.date;
  if (!ui.loaded){ $('#view').innerHTML = '<div class="loading">Carregando…</div>'; return; }
  const v = { dia:vDia, sorteio:vSorteio, jogo:vJogo, caixa:vCaixa, relatorios:vRel, cadastro:vCad }[ui.tab];
  const banner = ui.mode === 'local' ? `<div class="banner">Sem conexão com o servidor. Verifique a internet.</div>` : '';
  $('#view').className = ui.tab === 'jogo' ? 'wide' : '';
  $('#view').innerHTML = banner + lockBanner() + v();
  if ((ui.tab === 'dia' && ui.filtro) || (ui.tab === 'cadastro' && ui.filtroCad)) applyFiltro();
  tick();
}

/* ---------- DIA ---------- */
function vDia(){
  const d = S.days[ui.date];
  const pres = new Set(d?.presentes || []);
  const all = Object.entries(S.players).filter(([id,p]) => p.ativo !== false || pres.has(id))
    .sort((a,b) => a[1].nome.localeCompare(b[1].nome, 'pt-BR'));
  if (!Object.keys(S.players).length) return `<div class="card empty"><p>Nenhum jogador cadastrado ainda.</p><br><button class="btn pri" data-a="tab" data-k="cadastro">Cadastrar jogadores</button></div>`;
  const cnt = [0,0,0,0,0,0]; pres.forEach(id => { if (!isGol(id)) cnt[potOf(d,id)]++; });
  const nGol = [...pres].filter(isGol).length;
  const nP = pres.size, paid = [...pres].filter(id => isPaid(d,id)).length;
  const fc = fechamento(d || {presentes:[], custo:S.config.valorHora*S.config.horas});
  const allOn = all.length > 0 && all.every(([id]) => pres.has(id));
  const list = all.filter(([id]) => !ui.soloPres || pres.has(id));
  const row = ([id,p]) => {
    const on = pres.has(id), pt = potOf(d,id);
    return `<div class="prow inl ${on?'':'off'}" data-nm="${esc(norm(p.nome))}" ${ui.filtro && !matchNm(p.nome, ui.filtro) ? 'hidden' : ''}>
      <button class="chk" data-a="pres" data-id="${id}" aria-label="Presença">✓</button>
      <span class="nm">${esc(p.nome)}${isMensal(ui.date, id) ? ' <span class="mtag">M</span>' : ''}${(d?.saiuJ||{})[id] ? ` <small style="color:var(--warn);font-weight:600">saiu no jogo ${d.saiuJ[id]}</small>` : ''}</span>
      ${isGol(id) ? `<span class="chip" style="margin-left:auto">🧤 Goleiro</span>` : `<div class="potsro">${[1,2,3,4,5].map(n => `<span class="${n===pt ? 'pb p'+n : 'po'}">${n}</span>`).join('')}</div>`}
    </div>`;
  };
  const rowsJ = list.filter(([id]) => !isGol(id)).map(row).join(''), rowsG = list.filter(([id]) => isGol(id)).map(row).join('');
  return `
  ${d && d.obs ? `<div class="banner"><b>A revisar:</b> ${esc(d.obs)}<div class="btns" style="margin-top:8px"><button class="btn sm" data-a="revisado">Marcar como revisado</button></div></div>` : ''}

    <h2>${fdate(ui.date)} <span class="sp sm mu" style="font-family:Inter;text-transform:none;font-weight:500">${nP} presentes${!nP && !(d && d.semJogo) && ui.date < ymd(new Date()) ? ' · <button class="btn sm" data-a="semjogo">Não teve jogo</button>' : ''}</span></h2>
    <div class="stats">
      <div class="stat"><div class="l">Jogadores</div><div class="v">${nP - nGol}<span class="mu" style="font-size:16px">/20</span></div></div>
      <div class="stat"><div class="l">Goleiros</div><div class="v">${nGol}</div></div>
    </div>

    <h2>Lista de presença <span class="sp btns"><button class="btn sm" data-a="allpres">${allOn ? 'Desmarcar todos' : 'Marcar todos'}</button><button class="btn sm" data-a="solo">${ui.soloPres ? 'Mostrar todos' : 'Só presentes'}</button></span></h2>
    <div class="filtro"><input id="filtro" type="search" placeholder="🔍 Filtrar por nome…" value="${esc(ui.filtro||'')}" autocomplete="off"></div>
    <div class="sect">Jogadores</div>
    <div class="plist">${rowsJ || '<div class="empty">Ninguém marcado ainda</div>'}</div>

    <div style="display:flex;gap:8px;margin-top:10px"><input id="quickAdd" placeholder="Adicionar jogador (nome)"><select id="quickPot" style="width:118px">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===3?'selected':''}>Pote ${n}</option>`).join('')}<option value="G">🧤 Goleiro</option></select><button class="btn" data-a="quickadd">+</button></div>

/* ---------- SORTEIO ---------- */
function vSorteio(){
  const d = S.days[ui.date];
  const linha = (d?.presentes || []).filter(id => !isGol(id) && S.players[id]);
  const gols = (d?.presentes || []).filter(id => isGol(id));

  const n = linha.length, cnt = [0,0,0,0,0,0]; linha.forEach(id => cnt[potOf(d,id)]++);
  const mudou = id => d.potes && d.potes[id] && d.potes[id] !== S.players[id]?.pote;
  const nMud = linha.filter(mudou).length;
  const sorted = linha.slice().sort((x,y) => pname(x).localeCompare(pname(y),'pt-BR'));
  return `
  <div class="card">
    <h2>Potes do dia <span class="sp sm mu" style="font-family:Inter;text-transform:none;font-weight:500">${n} jogadores${gols.length ? ' · 🧤 ' + gols.length : ''}</span></h2>
    <div class="potbar">${[1,2,3,4,5].map(p => `<span class="${n===20 && cnt[p]!==4 ? 'w':''}"><b class="pb p${p}" style="width:16px;height:16px;font-size:11px">${p}</b> ${cnt[p]}</span>`).join('')}<span class="mu">${n===20 ? 'ideal: 4 por pote' : 'com 20: 4 por pote'}</span></div>
    <p class="sm mu" style="margin-bottom:10px">Ajuste o pote de quem veio hoje. <b>Vale só para este dia</b> — o pote do cadastro não muda.${nMud ? ` ${nMud} alterado${nMud>1?'s':''} hoje.` : ''}</p>
    ${[1,2,3,4,5].map(pp => { const grp = sorted.filter(id => potOf(d,id) === pp);
      return `<div class="sect potsect"><span class="pb p${pp}">${pp}</span> Pote ${pp} <span class="mu ${n===20 && grp.length!==4 ? 'wtxt' : ''}">· ${grp.length} jogador${grp.length===1?'':'es'}</span></div>
      <div class="plist">${grp.map(id => `<div class="prow inl">
        <span class="nm">${esc(pname(id))}${mudou(id) ? ` <small class="mu" style="font-weight:500">(cadastro: ${S.players[id].pote})</small>` : ''}</span>
        <div class="pots">${[1,2,3,4,5].map(p => `<button class="pot p${p} ${p===potOf(d,id)?'sel':''}" data-a="pot" data-id="${id}" data-n="${p}">${p}</button>`).join('')}</div></div>`).join('') || '<div class="sm mu" style="padding:4px 2px">Ninguém neste pote</div>'}</div>`; }).join('')}
    ${nMud ? '<button class="btn sm" style="margin-top:10px" data-a="resetpotes">Voltar todos ao pote do cadastro</button>' : ''}
    ${gols.length ? `<div class="sm mu" style="margin-top:10px">🧤 Goleiros (fora do sorteio): ${gols.map(id => esc(pname(id))).join(', ')}</div>` : ''}
  </div>
  ${vTimes(d)}`;
}

      <hr>
      <span><b>Pix a fazer ao dono</b></span><span class="v big">${brl(fc.pixDono)}</span>
      ${fc.excesso > 0 ? `<span style="grid-column:1/-1;color:var(--warn)" class="sm">O balcão recebeu ${brl(fc.excesso)} a mais que o custo da quadra — combine com o dono para abater na próxima terça.</span>` : ''}
      <hr>
      <span>Pix recebido por você</span><span class="v">${brl(fc.pix)}</span>
      <span>Fica para o caixa</span><span class="v ${fc.pix - fc.pixDono >= 0 ? 'pos':'neg'}">${brl(fc.pix - fc.pixDono)}</span>
      <span class="sm mu" style="grid-column:1/-1">${d.presentes.filter(id => !isPaid(d,id)).length} ainda não pagaram — se pagarem no balcão depois, o pix ao dono diminui.</span>

function vTimes(d){
  if (!d || !d.presentes.length) return '';
  const head = `<h2>Times <span class="sp btns"><button class="btn sm ${d.times?'':'pri'}" data-a="draw">${d.times ? 'Sortear de novo' : 'Sortear times'}</button>${d.times?'<button class="btn sm bad" data-a="cleartimes">Limpar</button>':''}</span></h2>`;
  if (!d.times) return `<div class="card">${head}<p class="mu sm">O sorteio coloca 1 jogador de cada pote em cada time (com 20 presentes e 4 por pote). Se os potes estiverem desiguais, ele equilibra pela soma dos potes.</p></div>`;
  const inT = new Set(d.times.flat());
  const out = d.presentes.filter(id => !inT.has(id) && !isGol(id));
  const teams = d.times.map((t,ti) => {
    const avg = t.length ? (t.reduce((s,id) => s + potOf(d,id), 0) / t.length).toFixed(1) : '-';
    return `<div class="team"><div class="th" style="background:${TEAMC};color:#fff">${esc(tname(ti))}<small>${t.length} jog · média pote ${avg}</small>${ui.sel && ui.sel.t === -1 ? `<button class="btn sm" style="background:rgba(0,0,0,.25);border:0" data-a="putin" data-t="${ti}">+ aqui</button>`:''}</div>
      <ul>${t.slice().sort((a,b)=>potOf(d,a)-potOf(d,b)).map(id => { const i = t.indexOf(id); const s = ui.sel && ui.sel.t===ti && ui.sel.i===i;
        return `<li><button class="${s?'sel':''}" data-a="swap" data-t="${ti}" data-i="${i}"><span class="pb p${potOf(d,id)}">${potOf(d,id)}</span>${esc(pname(id))}</button></li>`; }).join('')}${vagasOf(d,ti).map(v => `<li><button style="opacity:.6;border:1px dashed var(--line)">${v.pot ? `<span class="pb p${v.pot}">${v.pot}</span>` : ''}Vaga${v.pot ? ' — pote ' + v.pot : ''}</button></li>`).join('')}</ul></div>`;
  }).join('');
  return `<div class="card">${head}
    <p class="sm mu" style="margin-bottom:10px">Toque em um jogador e depois em outro para trocá-los de time.</p>
    ${out.length ? `<div style="margin-bottom:10px"><div class="sm mu" style="margin-bottom:6px">Sem time (chegaram depois do sorteio) — toque e escolha “+ aqui”:</div><div class="chips">${out.map(id => `<button class="chip ${ui.sel && ui.sel.pid===id?'sel':''}" data-a="pickout" data-id="${id}"><span class="pb p${potOf(d,id)}">${potOf(d,id)}</span>${esc(pname(id))}</button>`).join('')}</div></div>` : ''}
    <div class="teams">${teams}</div>
    <button class="btn blk" style="margin-top:12px" data-a="copytimes">📋 Copiar times para o WhatsApp</button>
    <button class="btn pri blk" style="margin-top:8px" data-a="tab" data-k="jogo">Ir para o painel do jogo →</button>
  </div>`;
}

/* ---------- JOGO ---------- */
function goalModal(i, step){
  const d = S.days[ui.date], e = (live.ev||[])[i]; if (!d || !e) return;
  const t = d.fila[e.s], team = lineup(d, t);
  const pb = id => `<span class="pb p${potOf(d,id)}">${potOf(d,id)}</span>`;
  let h;
  if (step === 'g'){
    h = `<h3>⚽ Gol do ${esc(tname(t))}</h3><p class="sm mu">Quem fez?</p>
      <div class="cand">${team.map(id => `<button data-a="gsc" data-i="${i}" data-p="${id}" style="${e.g===id?'outline:2px solid var(--ac)':''}">${pb(id)}${esc(pname(id))}</button>`).join('')}
      <button data-a="gsc" data-i="${i}" data-p="contra" style="${e.g==='contra'?'outline:2px solid var(--ac)':''}">Gol contra</button></div>
      <button class="btn" data-a="mclose">Depois</button>`;
  } else {
    h = `<h3><span class="abox">A</span> Assistência</h3><p class="sm mu">Gol de ${esc(pname(e.g))} — quem deu o passe?</p>
      <div class="cand">${team.filter(id => id !== e.g).map(id => `<button data-a="gas" data-i="${i}" data-p="${id}" style="${e.a===id?'outline:2px solid var(--ac)':''}">${pb(id)}${esc(pname(id))}</button>`).join('')}</div>
      <button class="btn pri" data-a="gas" data-i="${i}" data-p="">Sem assistência</button>`;
  }
  modal(h);
}

// escalação real do time no jogo (com substitutos; ausentes sem substituto ficam de fora)
// vagas: time com menos de 5 → uma vaga para cada pote que falta no time
function vagasOf(d, t){
  const team = d.times[t] || [], n = Math.max(0, 5 - team.length);
  const miss = [1,2,3,4,5].filter(p => !team.some(id => potOf(d,id) === p));
  return Array.from({length:n}, (_,k) => ({ key:`v${t}_${k}`, pot: miss[k] || null }));
}
const lineup = (d, t) => [...(d.times[t]||[]).map(id => (d.aus||{})[id] ? (d.subs||{})[id] : id), ...vagasOf(d,t).map(v => (d.subs||{})[v.key])].filter(Boolean);
function candList(d, key, pt){
  const sb = (d.subs||{})[key];
  const used = new Set(Object.values(d.subs||{}));
  const inT = new Set(d.times.flat());
  const pool = [...[d.fila[2], d.fila[3]].flatMap(x => d.times[x] || []), ...d.presentes.filter(x => !inT.has(x))]
    .filter(x => !(d.aus||{})[x] && !isGol(x) && (!used.has(x) || x === sb));
  const teamOf = x => { const k = d.times.findIndex(tt => tt.includes(x)); return k >= 0 ? tname(k) : 'sem time'; };
  const last = d.jogos[d.jogos.length - 1], prev = new Set((last && last.comp) || []);
  const nComp = {}; d.jogos.forEach(j => (j.comp||[]).forEach(x => nComp[x] = (nComp[x]||0) + 1));
  const btn = x => `<button data-a="setsub" data-id="${key}" data-s="${x}" style="${x===sb?'outline:2px solid var(--ac);':''}${prev.has(x)?'opacity:.55':''}"><span class="pb p${potOf(d,x)}">${potOf(d,x)}</span>${esc(pname(x))}<small>${esc(teamOf(x))}${prev.has(x) ? ' · completou no jogo anterior' : nComp[x] ? ` · completou ${nComp[x]}x hoje` : ''}</small></button>`;
  // Art. 9º e 11: quem completou no jogo anterior vai para o fim; menos complementações hoje vem primeiro
  const ord = arr => arr.sort((x,y) => (prev.has(x) - prev.has(y)) || ((nComp[x]||0) - (nComp[y]||0)) || (potOf(d,x) - potOf(d,y)));
  const tirar = sb ? `<button class="btn blk" data-a="setsub" data-id="${key}" data-s="">Tirar substituto</button>` : '';
  if (!pt) return `<div class="sm" style="font-weight:600">Escolha quem completa neste jogo (todos que estão de fora):</div><div class="cand">${ord([...pool]).map(btn).join('') || '<p class="sm mu">Ninguém disponível.</p>'}</div>` + tirar;
  // Art. 8º: mesmo pote ou pote inferior (número maior) aparecem primeiro; os demais de fora vêm logo abaixo, sempre visíveis
  const ok = ord(pool.filter(x => potOf(d,x) >= pt)), acima = ord(pool.filter(x => potOf(d,x) < pt));
  return `<div class="sect" style="margin-top:2px">Pelo regulamento — pote ${pt} ou inferior</div>
    <div class="cand">${ok.map(btn).join('') || '<p class="sm mu">Ninguém do pote ' + pt + ' ou inferior está de fora.</p>'}</div>
    ${acima.length ? `<div class="sect">Outros de fora — potes superiores</div><div class="cand">${acima.map(btn).join('')}</div>` : ''}
    ${tirar}`;
}
function empateModal(d, a, b){
  const first = !d.jogos.length;
  modal(`<h3>Empate</h3><p class="sm mu">${first ? 'Empate no primeiro jogo: o regulamento manda decidir no <b>par ou ímpar</b> (Art. 21).' : 'Os dois times entraram juntos, então não dá para saber quem entrou por último. Decidam no <b>par ou ímpar</b>.'} Quem fica como <b>PRÓ</b>?</p>
    <div class="grid2"><button class="btn" style="background:${COLETE[0].c};color:${COLETE[0].t};border:0" data-a="res" data-r="e" data-pro="${a}">${esc(tname(a))}</button>
    <button class="btn" style="background:${COLETE[1].c};color:${COLETE[1].t};border:0" data-a="res" data-r="e" data-pro="${b}">${esc(tname(b))}</button></div>
    <button class="btn" data-a="mclose">Cancelar</button>`);
}
function vagaModal(d, key, t, pt){
  const field = (d.filaOk || d.jogos.length) && (d.fila[0] === t || d.fila[1] === t);
  let h = `<h3>Vaga ${pt ? `<span class="pb p${pt}">${pt}</span>` : ''}</h3><p class="sm mu">${esc(tname(t))} está com ${(d.times[t]||[]).length} jogadores${pt ? ` — falta o pote ${pt}` : ''}.</p>`;
  h += field ? candList(d, key, pt) : `<p class="sm mu">Quando o time entrar em campo, toque na vaga para escolher quem completa${pt ? ' (do pote ' + pt + ')' : ''}.</p>`;
  modal(h + `<button class="btn" data-a="mclose">Fechar</button>`);
}
function slotModal(d, id, t){
  const field = (d.filaOk || d.jogos.length) && (d.fila[0] === t || d.fila[1] === t);
  const aus = (d.aus||{})[id], sb = (d.subs||{})[id], pt = potOf(d,id);
  const sj = (d.saiuJ||{})[id];
  let h = `<h3>${esc(pname(id))} <span class="pb p${pt}">${pt}</span></h3><p class="sm mu">${esc(tname(t))}${sj ? ' · saiu no jogo ' + sj : ''}</p>`;
  if (!aus){
    h += `<button class="btn blk" data-a="${d.jogos.length || field ? 'saiuj' : 'setaus'}" data-id="${id}" data-t="${t}">${d.jogos.length || field ? 'Saiu do jogo (lesão, foi embora…)' : 'Não chegou / faltou'}</button>`;
  } else {
    if (field){
      h += candList(d, id, pt);
    } else h += `<p class="sm mu">O substituto é escolhido quando o time entrar em campo.</p>`;
    h += `<button class="btn pri blk" data-a="unaus" data-id="${id}">${esc(pname(id).split(' ')[0])} ${sj ? 'voltou' : 'chegou'}</button>`;
  }
  h += `<button class="btn" data-a="mclose">Fechar</button>`;
  modal(h);
}

function vOrdem(d){
  const o = ui.ordem || [];
  const ROLE = ['Joga — colete amarelo','Joga — colete azul','Pró','Ré'];

  const nAus = t => (d.times[t]||[]).filter(id => (d.aus||{})[id]).length + vagasOf(d,t).length;
  return `<div class="card">
    <h2>Primeiro jogo do dia</h2>
    <p class="mu sm" style="margin-bottom:8px">Toque nos times na ordem de entrada: os dois primeiros começam jogando, o 3º é o pró e o 4º é o ré. Pelo regulamento (Art. 17), <b>times com menos ausentes têm prioridade</b>; empate em ausentes, par ou ímpar.</p>
    <div class="btns" style="margin-bottom:12px"><button class="btn sm" data-a="ordemaus">Ordenar por ausentes</button><button class="btn sm" data-a="ordemmarcar">Marcar quem não chegou</button></div>
    <div class="plist">${[0,1,2,3].map(t => { const k = o.indexOf(t);
      return `<button class="prow" style="text-align:left;${k>=0?'outline:2px solid var(--ac)':''}" data-a="ordem" data-t="${t}">
        <span class="chk" style="${k>=0?'':'background:transparent;border-color:var(--line);color:var(--mu)'}">${k>=0 ? (k+1)+'º' : ''}</span>
        <span style="flex:1;min-width:0"><b class="cond" style="font-size:20px;text-transform:uppercase">${esc(tname(t))}</b>
        ${k>=0 ? `<span class="sm" style="margin-left:6px;color:${k===0?COLETE[0].c:k===1?'#7fb0ff':'var(--ac)'}">${ROLE[k]}</span>` : ''}
        <span class="sm" style="margin-left:6px;color:${nAus(t)?'var(--warn)':'var(--mu)'}">${nAus(t) ? nAus(t) + ' ausente' + (nAus(t)>1?'s':'') : 'completo'}</span>
        <span class="sm mu" style="display:block;white-space:normal">${roster(t)}</span></span></button>`; }).join('')}</div>
    <div class="btns" style="margin-top:12px"><button class="btn" data-a="ordemclr">Limpar</button><button class="btn pri" style="flex:1" data-a="ordemok" ${o.length>=3?'':'disabled'}>Confirmar e ir para o jogo</button></div>
  </div>`;
}

function vJogo(){
  const d = S.days[ui.date];
  if (!d || !d.times) return `<div class="card empty"><p>Faça o sorteio dos times na aba <b>Sorteio</b> primeiro.</p><br><button class="btn pri" data-a="tab" data-k="sorteio">Ir para o Sorteio</button></div>`;
  if (!d.filaOk && !d.jogos.length) return vOrdem(d);
  if (live.date !== ui.date){ live = {...LIVE0(), date:ui.date}; saveLive(); }
  const [a,b,p,r] = d.fila;
  const aus = d.aus || {}, subs = d.subs || {};
  const evb = id => { const ev = live.ev || []; const ng = ev.filter(e => e.g === id).length, na = ev.filter(e => e.a === id).length;
    return (ng ? ` <b class="evb">${'⚽'.repeat(ng)}</b>` : '') + (na ? ` <b class="evb">${'<span class="abox">A</span>'.repeat(na)}</b>` : ''); };
  const keyTeam = k => k[0] === 'v' ? +k.slice(1).split('_')[0] : d.times.findIndex(tt => tt.includes(k));
  const slots = (t, field) => {
    const team = d.times[t] || [];
    const items = team.map(id => ({pot:potOf(d,id), id}));
    vagasOf(d, t).forEach(v => items.push({pot:v.pot || 9, vaga:v}));
    items.sort((x,y) => x.pot - y.pot);
    return items.map(it => {
      if (it.vaga){
        const v = it.vaga, sb = subs[v.key], pl = v.pot ? `<span class="pb p${v.pot}">${v.pot}</span>` : '<span class="pb" style="background:var(--mu)">?</span>';
        if (field && sb) return `<span class="slotw"><button class="slot sub" data-a="vaga" data-k="${v.key}" data-t="${t}" data-p="${v.pot||''}"><span class="pb p${potOf(d,sb)}">${potOf(d,sb)}</span><span>${esc(pname(sb))}${evb(sb)}<small>completando a vaga${v.pot ? ' do pote ' + v.pot : ''}</small></span></button><button class="sx" data-a="subsaiu" data-k="${v.key}" data-t="${t}" data-p="${v.pot||''}" title="Saiu do jogo">✕</button></span>`;
        if (field) return `<button class="slot vaga" data-a="vaga" data-k="${v.key}" data-t="${t}" data-p="${v.pot||''}">${pl}<span>＋ Completar<small>vaga${v.pot ? ' do pote ' + v.pot : ''}</small></span></button>`;
        return `<button class="slot aus" style="text-decoration:none" data-a="vaga" data-k="${v.key}" data-t="${t}" data-p="${v.pot||''}">${pl}Vaga${v.pot ? ' — pote ' + v.pot : ''}</button>`;
      }
      const id = it.id, pt = it.pot;
      const emp = !field && Object.keys(subs).find(k => subs[k] === id && (k[0] === 'v' || aus[k]));
      if (!aus[id]){ const bt = `<button class="slot" data-a="slot" data-id="${id}" data-t="${t}" data-dz="t${t}" data-di="${team.indexOf(id)}" data-nm="${esc(pname(id))}"><span class="pb p${pt}">${pt}</span><span>${esc(pname(id))}${field ? evb(id) : ''}${emp ? `<small>completando o ${esc(tname(keyTeam(emp)))}</small>` : ''}</span></button>`;
        return field ? `<span class="slotw">${bt}<button class="sx" data-a="saiuj" data-id="${id}" data-t="${t}" title="Saiu do jogo">✕</button></span>` : bt; }
      if (!field) return `<button class="slot aus" data-a="slot" data-id="${id}" data-t="${t}"><span class="pb p${pt}">${pt}</span>${esc(pname(id))} (ausente)</button>`;
      const sb = subs[id];
      if (sb) return `<span class="slotw"><button class="slot sub" data-a="slot" data-id="${id}" data-t="${t}"><span class="pb p${potOf(d,sb)}">${potOf(d,sb)}</span><span>${esc(pname(sb))}${evb(sb)}<small>no lugar de ${esc(pname(id))}</small></span></button><button class="sx" data-a="subsaiu" data-k="${id}" data-t="${t}" title="Saiu do jogo">✕</button></span>`;
      return `<button class="slot vaga" data-a="slot" data-id="${id}" data-t="${t}"><span class="pb p${pt}">${pt}</span><span>＋ Completar<small>${esc(pname(id))} ausente</small></span></button>`;
    }).join('');
  };
  const roster = t => `<div class="qlist">${slots(t,false)}</div>`;
  const side = (t, k) => `<div class="side" style="background:${COLETE[k].c};color:${COLETE[k].t}">
      <div class="tn">${esc(tname(t))}</div><div class="sm" style="font-weight:700;opacity:.8;margin-top:-6px">colete ${COLETE[k].n.toLowerCase()}</div><div class="gl num">${live.g[k]}</div>
      <div class="gb"><button data-a="gol" data-k="${k}" data-d="-1">−</button><button class="plus" data-a="gol" data-k="${k}" data-d="1">+</button></div>
      <div class="roster">${slots(t,true)}</div></div>`;
  const sug = live.done ? (live.g[0] > live.g[1] ? 'a' : live.g[1] > live.g[0] ? 'b' : 'e') : '';
  const wins = [0,0,0,0]; d.jogos.forEach(j => { if (j.r==='a') wins[j.a]++; else if (j.r==='b') wins[j.b]++; });
  const st = live.run ? 'Pausar' : (live.acc > 0 && !live.done ? 'Continuar' : 'Iniciar');
  return `<div class="jgrid"><div class="jmain">
  <div class="card">
    <h2>Jogo ${d.jogos.length + 1} ${d.streak && d.streak.n >= 1 && (d.streak.t === a || d.streak.t === b) ? `<span class="chip" style="font-family:Inter;text-transform:none;${d.streak.n >= 2 ? 'background:#5a3d0c;color:#ffd99a' : ''}">${esc(tname(d.streak.t))}: ${d.streak.n} vitória${d.streak.n>1?'s':''} seguida${d.streak.n>1?'s':''}${d.streak.n >= 2 ? ' — se vencer, sai para ré' : ''}</span>` : ''}<span class="sp sm mu" style="font-family:Inter;text-transform:none;font-weight:500">${S.config.minutos} min ou ${S.config.gols} gols</span></h2>
    <div class="clockbox">
      <div class="clock num" id="clock">${fclock(remaining())}</div>
      <div class="ctrl">
        <button class="btn ${live.run?'':'pri'}" data-a="clock" ${live.done?'disabled':''}>${live.run ? '❚❚' : '▶'} ${st}</button>
        <button class="btn" data-a="reset" title="Zerar">↺ Zerar</button>
        <button class="btn bad" data-a="encerrar" ${live.done || (!live.run && live.acc === 0) ? 'disabled' : ''}>■ Encerrar</button>
      </div>
      ${live.done ? `<div class="cmsg sm" style="color:var(--bad);font-weight:700">FIM — ${live.why==='gols' ? S.config.gols + ' gols' : live.why==='enc' ? 'jogo encerrado' : 'tempo esgotado'}</div>` : ''}
    </div>
    <div class="board vsb">
      ${side(a,0)}
      <div class="vs">X</div>
      ${side(b,1)}
    </div>
    ${live.done ? `<div class="resdone" style="margin-top:10px;background:${sug==='e' ? 'var(--s3)' : COLETE[sug==='a'?0:1].c};color:${sug==='e' ? 'var(--tx)' : COLETE[sug==='a'?0:1].t}">
        <div class="rt">${sug==='e' ? 'Empate' : 'Vitória do ' + esc(tname(sug==='a'?a:b))} <span class="num">${live.g[0]} × ${live.g[1]}</span></div>
        <div class="btns"><button class="btn pri nxt" data-a="res" data-r="${sug}">PRÓXIMO JOGO →</button></div>
      </div>` : ''}
    ${(live.ev||[]).length ? `<div class="evlist">${live.ev.map((e,i) => `<button class="chip" data-a="gedit" data-i="${i}"><i class="dot" style="background:${COLETE[e.s].c}"></i>⚽ ${e.g ? (e.g==='contra' ? 'gol contra' : esc(pname(e.g))) : '<span style="color:var(--warn)">quem fez?</span>'}${e.a ? ` <span class="mu"><span class="abox">A</span> ${esc(pname(e.a))}</span>` : ''}</button>`).join('')}</div>` : ''}
    <p class="sm mu rulehint" style="margin-top:8px;text-align:center">Quem perde sai: o PRÓ entra e o RÉ vira PRÓ · Empate: saem os dois, quem entrou por último volta como PRÓ · 3 vitórias seguidas: o vencedor sai e vai para RÉ</p>
  </div></div><div class="jside">
  <div class="card">
    <h2>Próximos <span class="sp btns"><button class="btn sm" data-a="swapq">⇄ Inverter pró/ré</button><button class="btn sm" data-a="editq">Ajustar fila</button></span></h2>
    <p class="sm mu" style="margin:-4px 0 8px">✋ Segure um nome e arraste sobre outro para trocar os dois de time.</p>
    <div class="queue">
      <div class="qcard" style="border-color:var(--ac)"><div class="ql">Pró</div><div class="qn">${esc(tname(p))}</div>${roster(p)}</div>
      <div class="qcard" style="border-color:var(--mu)"><div class="ql">Ré</div><div class="qn">${esc(tname(r))}</div>${roster(r)}</div>
    </div>
  </div>
  <div class="card">
    <h2>Jogos do dia ${d.jogos.length ? '<button class="sp btn sm" data-a="undo">Desfazer último</button>' : ''}</h2>
    ${d.jogos.length ? `<div class="potbar">${[0,1,2,3].map(t => `<span>${esc(tname(t))}: <b>${wins[t]}</b> vit.</span>`).join('')}</div>
    <div class="hist">${d.jogos.map((j,i) => `<div><span class="mu" style="width:26px">#${i+1}</span><i class="dot" style="background:${COLETE[0].c}"></i><b>${esc(tname(j.a))}</b> <span class="num" style="font-size:18px">${j.ga} × ${j.gb}</span> <b>${esc(tname(j.b))}</b><i class="dot" style="background:${COLETE[1].c}"></i></div>`).join('')}</div>
    ${(() => { const st = goalStats([d]); const top = Object.entries(st.g).sort((x,y) => y[1]-x[1]).slice(0,5); const ta = Object.entries(st.a).sort((x,y) => y[1]-x[1]).slice(0,5);
      return top.length || ta.length ? `<div class="grid2" style="margin-top:10px"><div><div class="sm mu" style="font-weight:700;margin-bottom:4px">ARTILHARIA DO DIA</div>${top.map(([id,n]) => `<div class="sm">${esc(pname(id))} ⚽ <b>${n}</b></div>`).join('') || '<div class="sm mu">—</div>'}</div><div><div class="sm mu" style="font-weight:700;margin-bottom:4px">ASSISTÊNCIAS</div>${ta.map(([id,n]) => `<div class="sm">${esc(pname(id))} <span class="abox">A</span> <b>${n}</b></div>`).join('') || '<div class="sm mu">—</div>'}</div></div>` : ''; })()}`
    : '<p class="mu sm">Nenhum jogo registrado ainda.</p>'}
  </div></div></div>`;
}

/* ---------- CAIXA ---------- */
function vCal(){
  const m = ui.calMes || ui.date.slice(0,7); const [y,mo] = m.split('-').map(Number);
  const first = new Date(y, mo-1, 1), dim = new Date(y, mo, 0).getDate(), hoje = ymd(new Date());
  const cells = []; for (let i = 0; i < first.getDay(); i++) cells.push('<span></span>');
  for (let dd = 1; dd <= dim; dd++){
    const k = `${y}-${pad(mo)}-${pad(dd)}`, dw = new Date(y, mo-1, dd).getDay(), dy = S.days[k];
    const temJogo = dy && dy.presentes && dy.presentes.length;
    const pend = temJogo && dy.presentes.some(id => !isPaid(dy,id));
    cells.push(`<button class="${dw===2?'ter':''} ${k===ui.date?'sel':''} ${k===hoje?'hoje':''}" data-a="pickday" data-d="${k}">${dd}${temJogo ? `<i class="dt ${pend?'pend':''}"></i>` : ''}</button>`);
  }
  return `<div class="card">
    <div class="calh"><button class="btn sm" data-a="calnav" data-n="-1">‹</button><b>${fmonth(m)}</b><button class="btn sm" data-a="calnav" data-n="1">›</button></div>
    <div class="cal">${['D','S','T','Q','Q','S','S'].map((w,i) => `<span class="wd ${i===2?'t':''}">${w}</span>`).join('')}${cells.join('')}</div>
    <p class="sm mu" style="margin-top:8px">Terças em destaque. <span style="color:var(--ac)">●</span> dia com jogo · <span style="color:var(--warn)">●</span> com pagamento pendente.</p>
  </div>`;
}
function vPag(d){
  const lista = (d?.presentes || []).filter(id => !isGol(id)).sort((a,b) => pname(a).localeCompare(pname(b),'pt-BR'));
  const gols = (d?.presentes || []).filter(isGol);
  if (!lista.length) return `<div class="card"><h2>Pagamentos — ${fdate(ui.date)}</h2><p class="mu sm">Ninguém marcado como presente neste dia. Marque a presença na aba <b>Lista</b>.</p></div>`;
  const pagos = lista.filter(id => isPaid(d,id)).length, f = fechamento(d);
  return `<div class="card">
    <h2>Pagamentos — ${fdate(ui.date)} <span class="sp sm mu" style="font-family:Inter;text-transform:none;font-weight:500">${pagos}/${lista.length} pagos</span></h2>
    <div class="stats" style="margin-bottom:10px"><div class="stat"><div class="l">Pix</div><div class="v">${brl(f.pix)}</div></div><div class="stat"><div class="l">Balcão</div><div class="v">${brl(f.balcao)}</div></div></div>
    <div class="plist">${lista.map(id => { const ok = isPaid(d,id); return `<div class="prow inl">
      <span class="nm">${esc(pname(id))}${isMensal(d.data,id) ? ' <span class="mtag">M</span>' : ''}</span>
      ${cobertoMensal(d.data, id) ? '<span class="chip" style="margin-left:auto">Mensalista</span>' : `<div class="pays">${ok ? `<button class="pay ok ${formaOf(d,id)==='balcao'?'bal':''}" data-a="unpay" data-id="${id}">✓ ${({balcao:'Balcão', dinheiro:'Dinheiro'})[formaOf(d,id)] || 'Pix'}</button>`
        : `<button class="pay" data-a="pay" data-id="${id}" data-f="pix">Pix</button><button class="pay" data-a="pay" data-id="${id}" data-f="balcao">Balcão</button>`}</div>`}</div>`; }).join('')}</div>
    ${gols.length ? `<p class="sm mu" style="margin-top:8px">🧤 Goleiros (não pagam): ${gols.map(id => esc(pname(id))).join(', ')}</p>` : ''}
    <p class="sm mu" style="margin-top:6px">Toque no “✓” para desfazer um pagamento.</p>
  </div>`;
}
/* ---------- MENSALISTAS ---------- */
function tercasDo(m){ const [y,mo] = m.split('-').map(Number); const out = []; const t = new Date(y, mo-1, 1);
  while (t.getMonth() === mo-1){ if (t.getDay() === 2) out.push(ymd(t)); t.setDate(t.getDate()+1); } return out; }
function mesDraft(m){
  if (S.meses[m]) return S.meses[m];
  ui.mDraft ||= {};
  return ui.mDraft[m] ||= { valor: Number(S.config.valorMensal ?? 100), datas: tercasDo(m).slice(0,4),
    mens: Object.entries(S.players).filter(([,p]) => p.mensalista && p.ativo !== false && !p.goleiro).map(([id]) => id), pag:{}, forma:{} };
}
function vMensCad(){
  const m = ui.mesM || (() => { const t = new Date(); return ymd(new Date(t.getFullYear(), t.getMonth() + (t.getDate() > 20 ? 1 : 0), 1)).slice(0,7); })();
  const M = mesDraft(m), salvo = !!S.meses[m];
  const ters = tercasDo(m), cand = Object.entries(S.players).filter(([id,p]) => !p.goleiro && (p.ativo !== false || (M.mens||[]).includes(id))).sort((a,b) => a[1].nome.localeCompare(b[1].nome,'pt-BR'));
  const nM = (M.mens||[]).length, nD = (M.datas||[]).length;
  return `<div class="card">
    <h2>Mensalistas <span class="sp"><input type="month" data-c="mesM" value="${m}" style="width:auto;padding:6px 8px"></span></h2>
    ${salvo ? '' : `<div class="banner" style="margin-bottom:10px">Mês ainda não configurado. Confira os dados abaixo e toque em <b>Salvar mês</b>.</div>`}
    <div class="grid2" style="margin-bottom:10px">
      <label class="f">Valor da mensalidade (R$)<input type="number" step="0.01" data-c="mValor" value="${M.valor}"></label>
      <div class="stat"><div class="l">Por jogo</div><div class="v" style="font-size:22px">${nD ? brl((Number(M.valor)||0)/nD) : '—'}</div></div>
    </div>
    <div class="sm" style="font-weight:600;margin-bottom:6px">Terças cobertas pela mensalidade <span class="mu" style="font-weight:500">(${nD} de ${ters.length})</span></div>
    <div class="chips" style="margin-bottom:6px">${ters.map(t => `<button class="chip ${(M.datas||[]).includes(t)?'sel':''}" style="${(M.datas||[]).includes(t)?'background:var(--ac2)':'opacity:.6'}" data-a="mData" data-d="${t}">${(M.datas||[]).includes(t)?'✓ ':''}${fdate(t)}</button>`).join('')}</div>
    <p class="sm mu" style="margin-bottom:10px">Na terça que não estiver marcada, o mensalista paga como avulso.</p>
    <div class="sm" style="font-weight:600;margin-bottom:6px">Mensalistas do mês <span class="mu" style="font-weight:500">(${nM})</span></div>
    <div class="chips">${cand.map(([id,p]) => { const on = (M.mens||[]).includes(id); return `<button class="chip ${on?'sel':''}" style="${on?'':'opacity:.55'}" data-a="mMen" data-id="${id}">${on?'✓ ':''}${esc(p.nome)}</button>`; }).join('')}</div>
    <p class="sm mu" style="margin-top:8px">Vem marcado quem tem “Mensalista” no cadastro. Toque para incluir ou tirar só deste mês.</p>
    ${salvo ? `<p class="sm" style="margin-top:8px;color:var(--ac)">✓ Mês salvo — alterações são gravadas na hora. Pagamentos das mensalidades ficam na aba Caixa.</p><button class="btn bad sm" style="margin-top:6px" data-a="mDel">Excluir configuração do mês</button>`
      : `<button class="btn pri blk" style="margin-top:12px" data-a="mSave">Salvar mês</button>`}
  </div>`;
}
function vMensCaixa(m){
  const M = S.meses[m]; if (!M || !(M.mens||[]).length) return '';
  const lista = [...M.mens].sort((a,b) => pname(a).localeCompare(pname(b),'pt-BR'));

  return `<div class="card">
    <h2>Mensalidades — ${fmonth(m)} <span class="sp sm mu" style="font-family:Inter;text-transform:none;font-weight:500">${pagos.length}/${lista.length} pagos · ${brl(tot)}</span></h2>
    <p class="sm mu" style="margin-bottom:8px">${brl(M.valor)} cobrindo ${(M.datas||[]).map(t => fdate(t).split(' ')[1]).join(', ')}.</p>
    <div class="plist">${lista.map(id => { const ok = pagos.includes(id), f = (M.forma||{})[id];

/* ---------- RELATÓRIOS ---------- */
function monthData(m){
  const days = playedDays().filter(d => d.data.startsWith(m));
  const rows = {};
  for (const d of days) for (const id of partsOf(d)){
    const r = rows[id] ||= {pres:0, devido:0, pago:0};
    if ((d.presentes||[]).includes(id)) r.pres++; r.devido += dueOf(d,id); r.pago += paidOf(d,id);
  }
  const Mm = S.meses[m]; let mensal = 0;
  if (Mm) for (const id of Mm.mens||[]){ const r = rows[id] ||= {pres:0, devido:0, pago:0}; r.devido += Number(Mm.valor)||0; const pg = Number((Mm.pag||{})[id])||0; r.pago += pg; mensal += pg; }
  const w = winsByPlayer(days), gs = goalStats(days);
  const led = Object.values(S.ledger).filter(l => (l.data||'').startsWith(m));
  const ent = led.filter(l => l.tipo==='entrada').reduce((s,l) => s + (Number(l.valor)||0), 0);
  const sai = led.filter(l => l.tipo!=='entrada').reduce((s,l) => s + (Number(l.valor)||0), 0);
  const quadra = days.reduce((s,d) => s + (Number(d.custo)||0), 0);
  const devido = Object.values(rows).reduce((s,r) => s + r.devido, 0);
  const pago = Object.values(rows).reduce((s,r) => s + r.pago, 0);
  const jogos = days.reduce((s,d) => s + (d.jogos||[]).length, 0);
  const fs = days.map(fechamento); const pix = fs.reduce((s,f) => s + f.pix, 0), balcao = fs.reduce((s,f) => s + f.balcao, 0), pixDono = fs.reduce((s,f) => s + f.pixDono, 0);
  return { days, rows, w, gs, ent, sai, quadra, devido, pago, jogos, led, pix, balcao, pixDono, mensal };
}

function relText(m){
  const x = monthData(m);
  const rows = Object.entries(x.rows).sort((a,b) => b[1].pres - a[1].pres);
  let t = `⚽ *FUT TERÇA — ${fmonth(m).toUpperCase()}*\n\n`;
  t += `Dias de jogo: ${x.days.length} · Jogos: ${x.jogos}\nRecebido: ${brl(x.pago)} (Pix ${brl(x.pix)} · Balcão ${brl(x.balcao)})\nEm aberto: ${brl(x.devido - x.pago)}\nQuadra: ${brl(x.quadra)} · Saídas: ${brl(x.sai)}${x.ent?` · Entradas: ${brl(x.ent)}`:''}\nResultado do mês: ${brl(x.pago - x.quadra + x.ent - x.sai)}\nSaldo em caixa: ${brl(caixa().saldo)}\n\n`;
  const art = Object.entries(x.gs.g).sort((a,b) => b[1]-a[1]).slice(0,5), asi = Object.entries(x.gs.a).sort((a,b) => b[1]-a[1]).slice(0,5);
  if (art.length) t += `⚽ *Artilharia*\n${art.map(([id,n],i) => `${i+1}. ${pname(id)} — ${n}`).join('\n')}\n\n`;
  if (asi.length) t += `🅰️ *Assistências*\n${asi.map(([id,n],i) => `${i+1}. ${pname(id)} — ${n}`).join('\n')}\n\n`;
  t += `*Presença*\n`;
  rows.forEach(([id,r]) => { const ab = r.devido - r.pago; t += `${pname(id)} — ${r.pres}/${x.days.length}${ab>0.009 ? ` (deve ${brl(ab)})` : ''}\n`; });
  return t;
}
