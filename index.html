};
const C = {
  dayval: el => { const d = S.days[ui.date]; d.valor = parseFloat(el.value) || 0; saveDay(ui.date); render(); },
  daycost: el => { const d = S.days[ui.date]; d.custo = parseFloat(el.value) || 0; saveDay(ui.date); render(); },
  mesM: el => { if (el.value){ ui.mesM = el.value; render(); } },
  mValor: el => { const m = $('[data-c=mesM]').value, M = mesDraft(m); M.valor = parseFloat(el.value) || 0; if (S.meses[m]) save('meses/' + m, M); render(); },
  edgol: el => { const l = document.getElementById('edPotL'); if (l) l.style.display = el.checked ? 'none' : ''; },
  mes: el => { if (el.value){ ui.mes = el.value; render(); } }
};
/* ---------- fechamento do dia: depois de fechado, o dia não pode mais ser alterado ---------- */
const LOCK = new Set('solo allpres pres pot resetpotes revisado semjogo pay unpay donopago quickadd draw cleartimes swap pickout putin clock reset gol gedit gsc gas pickres encerrar res undo swapq editq ordem ordemclr ordemaus ordemmarcar toggleaus ordemok slot vaga setaus unaus saiuj subsaiu setsub saveq dayval daycost'.split(' '));
const dayLocked = (date = ui.date) => !!(S.days[date] && S.days[date].fechado);
function lockBanner(){
  if (!dayLocked() || !['dia','sorteio','jogo','caixa'].includes(ui.tab)) return '';
  const dt = new Date(S.days[ui.date].fechado.em);
  return `<div class="banner" style="background:#12301f;border-color:#1f6b45;color:#bff3d6">🔒 <b>Dia fechado</b> em ${pad(dt.getDate())}/${pad(dt.getMonth()+1)} às ${pad(dt.getHours())}:${pad(dt.getMinutes())}. Os dados estão gravados e não podem mais ser alterados.</div>`;
}
function vCaixa(){ return vCaixaBase() + vFecharDia(); }
function vFecharDia(){
  const d = S.days[ui.date]; if (!d || !(d.presentes||[]).length) return '';
  if (d.fechado) return `<div class="card"><h2>Fechamento do dia <span class="sp chip" style="background:var(--ac2)">🔒 fechado</span></h2><p class="sm">${fdate(ui.date)} está fechado e gravado. Quem ficou devendo ainda pode ser quitado em <b>Pendências</b>.</p></div>`;
  return `<div class="card"><h2>Fechar o dia</h2><p class="sm mu" style="margin-bottom:10px">Grava definitivamente a lista, os jogos e os pagamentos de ${fdate(ui.date)}. Depois disso, nada deste dia pode ser alterado.</p><button class="btn bad blk" style="font-size:17px;padding:14px" data-a="fechardia">🔒 Fechar o dia</button></div>`;
}
A.fechardia = async () => {
  const d = S.days[ui.date]; if (!d || d.fechado) return;
  const pend = (d.presentes || []).filter(id => dueOf(d, id) > 0 && !isPaid(d, id)).length;
  const emJogo = live.date === ui.date && (live.run || (live.acc > 0 && !live.done));
  const ok = await ask(`<b>⚠️ Fechar o dia ${fdate(ui.date)}?</b><br><br>Depois de fechado, <b>os dados deste dia ficam gravados no app e não podem mais ser modificados</b>: lista de presença, times, jogos, gols e pagamentos.${''}${pend ? `<br><br><b style="color:var(--warn)">${pend} jogador${pend > 1 ? 'es' : ''} ainda ${pend > 1 ? 'não pagaram' : 'não pagou'}</b> — fica${pend > 1 ? 'm' : ''} como pendência e pode${pend > 1 ? 'm' : ''} ser quitado${pend > 1 ? 's' : ''} depois em Pendências.` : ''}${emJogo ? '<br><br><b style="color:var(--warn)">Há um jogo em andamento que ainda não foi registrado — ele será descartado.</b>' : ''}<br><br>Confirmar ação:`, 'Fechar o dia', true);
  if (!ok) return;
  
  d.fechado = { em: Date.now() };
  if (live.date === ui.date){ live = {...LIVE0(), date:ui.date}; saveLive(); keepAwake(false); }
  saveDay(ui.date); render(); window.scrollTo(0,0); toast('🔒 Dia fechado e gravado');
};
/* ---------- arrastar nomes para trocar de lugar (entre os 4 times do dia) ---------- */
let drag = null, dragSupClick = 0, lastTouch = 0;
function dzOf(el){ const s = el && el.closest && el.closest('[data-dz]'); return s ? { el:s, z:s.dataset.dz, i:+s.dataset.di } : null; }
function dzArr(d, z){ return d.times[+z.slice(1)]; }
function dragStart(x, y){
  if (!drag || drag.on) return;
  const g = document.createElement('div'); g.className = 'dghost'; g.textContent = drag.src.el.dataset.nm || ''; document.body.appendChild(g);
  drag.on = true; drag.g = g; drag.src.el.classList.add('dsrc'); dragMove(x, y);
  try { navigator.vibrate && navigator.vibrate(30); } catch(e){}
}
function dragMove(x, y){
  if (!drag || !drag.on) return;
  drag.g.style.left = x + 'px'; drag.g.style.top = y + 'px';
  if (y > innerHeight - 90) scrollBy(0, 14); else if (y < 90) scrollBy(0, -14);   // rola a tela perto das bordas
  drag.g.style.display = 'none'; const t = dzOf(document.elementFromPoint(x, y)); drag.g.style.display = '';
  document.querySelectorAll('.dtgt').forEach(e => e.classList.remove('dtgt'));
  drag.tgt = (t && t.el !== drag.src.el) ? t : null; if (drag.tgt) drag.tgt.el.classList.add('dtgt');
}
function dragEnd(){
  if (!drag) return; clearTimeout(drag.tm);
  const dd = drag; drag = null;
  if (!dd.on) return;
  dd.g.remove(); document.querySelectorAll('.dtgt,.dsrc').forEach(e => e.classList.remove('dtgt','dsrc'));
  dragSupClick = Date.now();
  if (dd.tgt) trocarPos(dd.src, dd.tgt);
}
function trocarPos(a, b){
  const d = S.days[ui.date]; if (!d || !d.times) return;
  if (dayLocked()){ toast('🔒 Dia fechado — não pode mais ser alterado'); return; }
  const A1 = dzArr(d, a.z), id = A1[a.i]; if (!id) return;
  const B1 = dzArr(d, b.z), id2 = B1[b.i]; if (!id2) return;
  A1[a.i] = id2; B1[b.i] = id;
  saveDay(ui.date); render(); toast(`${pname(id)} ⇄ ${pname(id2)}`);
}
document.addEventListener('touchstart', e => {
  lastTouch = Date.now();
  const t = dzOf(e.target); if (!t || t.z[0] === 'v' || ui.tab !== 'jogo' || e.touches.length > 1) return;
  const p = e.touches[0];
  drag = { src:t, x0:p.clientX, y0:p.clientY, on:false };
  drag.tm = setTimeout(() => { if (drag && !drag.on) dragStart(drag.x0, drag.y0); }, 280);
}, { passive:true });
document.addEventListener('touchmove', e => {
  if (!drag) return; const p = e.touches[0];
  if (!drag.on){ if (Math.hypot(p.clientX - drag.x0, p.clientY - drag.y0) > 10){ clearTimeout(drag.tm); drag = null; } return; }
  e.preventDefault(); dragMove(p.clientX, p.clientY);
}, { passive:false });
document.addEventListener('touchend', dragEnd); document.addEventListener('touchcancel', dragEnd);
document.addEventListener('mousedown', e => {
  if (Date.now() - lastTouch < 800 || e.button !== 0) return;
  const t = dzOf(e.target); if (!t || t.z[0] === 'v' || ui.tab !== 'jogo') return;
  drag = { src:t, x0:e.clientX, y0:e.clientY, on:false };
});
document.addEventListener('mousemove', e => {
  if (!drag || Date.now() - lastTouch < 800) return;
  if (!drag.on){ if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) dragStart(e.clientX, e.clientY); return; }
  dragMove(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => { if (Date.now() - lastTouch >= 800) dragEnd(); });
document.addEventListener('contextmenu', e => { if (drag || dzOf(e.target)) e.preventDefault(); });
document.addEventListener('click', e => { if (Date.now() - dragSupClick < 400){ e.preventDefault(); e.stopPropagation(); return; } }, true);
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; const f = A[b.dataset.a]; if (f){ e.preventDefault(); if (LOCK.has(b.dataset.a) && dayLocked()){ toast('🔒 Dia fechado — não pode mais ser alterado'); return; } f(b.dataset, b); } });
document.addEventListener('input', e => {
  if (e.target.id === 'filtroCad'){ ui.filtroCad = e.target.value; applyFiltro(); return; }
  if (e.target.id !== 'filtro') return;
  ui.filtro = e.target.value;
  applyFiltro();
});
function applyFiltro(){
  const q = ui.tab === 'cadastro' ? ui.filtroCad : ui.filtro;
  document.querySelectorAll('#view .prow[data-nm]').forEach(r => { r.hidden = !matchNm(r.dataset.nm, q); });
  document.querySelectorAll('#view .plist').forEach(l => { if (!l.querySelector('.prow[data-nm]')) return;
    const vis = l.querySelector('.prow[data-nm]:not([hidden])'); const sec = l.previousElementSibling;
    if (sec && sec.classList.contains('sect')) sec.hidden = !vis; l.hidden = !vis; });
}
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]){ if (LOCK.has(el.dataset.c) && dayLocked()){ toast('🔒 Dia fechado — não pode mais ser alterado'); render(); return; } C[el.dataset.c](el); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newName') A.addp(); else if (e.target.id === 'quickAdd') A.quickadd();
});
$('#dateIn').addEventListener('change', e => { if (e.target.value){ ui.date = e.target.value; ui.calMes = null; ui.sel = null; render(); } });
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k !== ui.tab && TABS.some(t => t[0] === k)){ ui.tab = k; render(); } });

render();
init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
